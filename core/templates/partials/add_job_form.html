<div class="dialog-backdrop" id="add-job-dialog" style="z-index:50" onclick="if(event.target===this)this.remove()">
  <form class="dialog" hx-post="/jobs" hx-target="#add-job-dialog" hx-swap="outerHTML">
    <input type="hidden" name="force" value="0">
    <div class="dialog-title">Add job manually</div>
    <div class="dialog-body">
      <div style="font-size:12px;color:var(--color-neutral-600);margin-bottom:12px">Lands in Review (found), same as a scraped card.</div>
      <div style="display:grid;gap:10px">
        <label style="display:grid;gap:4px;font-size:12px;color:var(--color-neutral-700)">Title *
          <input type="text" name="title" required class="input">
        </label>
        <label style="display:grid;gap:4px;font-size:12px;color:var(--color-neutral-700)">Company
          <input type="text" name="company" class="input">
        </label>
        <label style="display:grid;gap:4px;font-size:12px;color:var(--color-neutral-700)">Posting URL
          <input type="url" name="url" class="input">
        </label>
        <label style="display:grid;gap:4px;font-size:12px;color:var(--color-neutral-700)">Location
          <input type="text" name="location" class="input">
        </label>
        <label style="display:grid;gap:4px;font-size:12px;color:var(--color-neutral-700)">Salary
          <input type="text" name="salary" class="input">
        </label>
        <label style="display:grid;gap:4px;font-size:12px;color:var(--color-neutral-700)">Description
          <textarea name="description" rows="6" class="input" style="resize:vertical"></textarea>
        </label>
        <label style="display:grid;gap:4px;font-size:12px;color:var(--color-neutral-700)">Source
          <input type="text" name="source" placeholder="Manual" class="input">
        </label>
      </div>
    </div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('add-job-dialog').remove()">Cancel</button>
      <button type="submit" class="btn btn-primary">Add job</button>
    </div>
  </form>
  <script>
    (function () {
      const dlg = document.getElementById('add-job-dialog');
      function onKey(e) {
        if (!document.body.contains(dlg)) { document.removeEventListener('keydown', onKey); return; }
        if (e.key === 'Escape') dlg.remove();
      }
      document.addEventListener('keydown', onKey);
    })();
  </script>
</div>
