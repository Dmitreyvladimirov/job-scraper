<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — JobScraper</title>
<link rel="stylesheet" href="/static/classical.css">
<style>
  body { padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { width: 100%; max-width: 360px; padding: var(--space-4); }
  .login-box h1 { font-size: 22px; margin: 0 0 var(--space-4); text-align: center; }
  .login-box input[type="password"] {
    width: 100%; padding: 10px 12px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--color-divider); border-radius: var(--radius-md);
    background: transparent; color: var(--color-text); margin-bottom: var(--space-4);
  }
  .login-box input[type="password"]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .login-box .btn { width: 100%; justify-content: center; }
</style>
</head>
<body class="">
<div class="login-box">
  <h1>JobScraper</h1>
  <form method="post" action="/login">
    <input type="password" name="token" placeholder="Dashboard token" autofocus required autocomplete="current-password">
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
</div>
<script>
  (function () {
    if (localStorage.getItem('jobscraper-theme') === 'dark') document.body.classList.add('dark');
  })();
</script>
</body>
</html>
